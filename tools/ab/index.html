<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Composer A/B</title>
<style>
  :root { color-scheme: dark; --bg: #16141f; --panel: #211e2d; --line: #34304a; --text: #e6e3f0; --dim: #a9a3bd; --accent: #ffc766; --bad: #ff8a8a; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
  header { padding: 16px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  h1 { font-size: 18px; margin: 0; }
  #info { color: var(--dim); flex-basis: 100%; }
  button { font: inherit; color: inherit; background: #2a2638; border: 1px solid #4a4560; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  label { color: var(--dim); }
  main { padding: 8px 16px 32px; }
  h2 { font-size: 14px; color: var(--dim); font-weight: 600; margin: 20px 0 6px; }
  .song { display: grid; grid-template-columns: minmax(160px, 220px) 1fr 1fr; gap: 6px 16px; align-items: start;
          padding: 10px 0; border-bottom: 1px solid var(--line); }
  .title { font-weight: 600; }
  .title button { margin-top: 6px; display: block; }
  .side { background: var(--panel); border-radius: 8px; padding: 8px 10px; min-height: 40px; }
  .side .name { color: var(--accent); font-weight: 600; margin-bottom: 4px; }
  .side audio { width: 100%; height: 32px; }
  .stats { color: var(--dim); font-size: 12px; margin-top: 4px; }
  .error { color: var(--bad); font-size: 12px; white-space: pre-wrap; }
  @media (max-width: 720px) { .song { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>Composer A/B</h1>
  <button id="all" type="button">Render all</button>
  <label><input id="blind" type="checkbox"> Blind (sides shuffled per song)</label>
  <button id="reveal" type="button" hidden>Reveal</button>
  <span id="status" role="status"></span>
  <div id="info"></div>
</header>
<main id="songs"></main>
<script type="module" src="ab.js"></script>
</body>
</html>
