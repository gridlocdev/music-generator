<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SoundFont Player</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; background: #141220; color: #eee; font: 16px system-ui, sans-serif; }
  .ui { position: fixed; left: 50%; transform: translateX(-50%); z-index: 10; pointer-events: none;
        padding: 6px 14px; border-radius: 999px; background: rgba(0, 0, 0, .55); }
  #toast { bottom: 64px; }
  #controls { position: fixed; top: 0; left: 0; right: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 16px;
              align-items: center; padding: 10px 16px; background: rgba(0, 0, 0, .45); font-size: 14px; }
  #controls select, #controls button { font: inherit; color: inherit; background: #2a2638; border: 1px solid #4a4560;
              border-radius: 6px; padding: 4px 8px; }
  #controls select { min-width: 220px; max-width: 100%; }
  #controls button:disabled { opacity: .7; }
  #controls select:focus { outline: 2px solid #ffc766; outline-offset: 1px; }
  #status { color: #ffc766; }
  #help { position: fixed; z-index: 10; bottom: 12px; left: 16px; right: 16px; text-align: center; font-size: 13px; color: #a9a3bd; }
  [hidden] { display: none !important; }
</style>
<!-- bare engine name for every module; editors resolve the same name to the package's types -->
<script type="importmap">
{ "imports": { "littlejsengine": "./node_modules/littlejsengine/dist/littlejs.esm.js" } }
</script>
</head>
<body>
<div id="controls"></div>
<div id="toast" class="ui" hidden></div>
<div id="help">Play with A–' (white) and W E T Y U O P (black) · Z / X octave · ↑ / ↓ instrument · I to browse instruments, Esc to play again · hold Space to sustain · click or drag the keys · or plug in a MIDI keyboard</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
